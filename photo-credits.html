<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>عن الصور التوضيحية</title><body style="font-family:Arial;line-height:1.9;max-width:720px;margin:48px auto;padding:24px;color:#1e3a8a"><h1>عن الصور التوضيحية</h1><p>صور التشطيبات والديكور والواجهات وأعمال التنفيذ المعروضة في الموقع مولّدة بالذكاء الاصطناعي لتوضيح الخدمات وأفكار التصميم. لا تمثل هذه الصور مشروعات منفذة بواسطة الشركة أو صورًا فعلية لأفراد فريقها.</p><a href="/">العودة إلى الموقع</a></body></html>
